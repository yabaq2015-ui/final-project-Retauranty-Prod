apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-root-issuer
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: restauranty-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "restauranty-ca"
  secretName: restauranty-ca-secret
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: internal-root-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  ca:
    secretName: restauranty-ca-secret
